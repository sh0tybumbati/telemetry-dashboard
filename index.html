<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Telemetry</title>
<style>
  :root {
    --bg:#0e1116; --panel:#161b22; --line:#242c38; --fg:#e6edf3; --dim:#8b949e;
    --accent:#2f81f7; --good:#3fb950; --warn:#d29922; --bad:#f85149;
    --c1:#2f81f7; --c2:#3fb950; --c3:#d29922; --c4:#db61a2; --c5:#a371f7;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
           padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel);
           position:sticky; top:0; z-index:10; }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.02em; }
  header .spacer { flex:1; }
  select, button, input {
    background:#0d1117; color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:7px 11px; font:inherit; font-size:13px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  main { padding:20px; max-width:1500px; margin:0 auto; }

  .login { max-width:420px; margin:8vh auto; background:var(--panel);
           border:1px solid var(--line); border-radius:12px; padding:28px; }
  .login h2 { margin:0 0 6px; font-size:18px; }
  .login p  { margin:0 0 20px; color:var(--dim); font-size:13px; }
  .login label { display:block; font-size:12px; color:var(--dim); margin:12px 0 5px; }
  .login input { width:100%; }
  .login button { width:100%; margin-top:20px; padding:10px; }
  .err { color:var(--bad); font-size:12.5px; margin-top:12px; white-space:pre-wrap; }
  .hint { color:var(--dim); font-size:11.5px; margin-top:14px; line-height:1.6; }

  .strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
           gap:12px; margin-bottom:20px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .stat .v { font-size:26px; font-weight:650; letter-spacing:-.02em; }
  .stat .k { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr));
          gap:16px; align-items:start; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:16px 18px; min-width:0; }
  .card.wide { grid-column:1/-1; }
  .card h3 { margin:0 0 3px; font-size:14px; font-weight:600; }
  .card .sub { color:var(--dim); font-size:12px; margin:0 0 14px; }
  .card .body { overflow-x:auto; }
  .empty { color:var(--dim); font-size:13px; padding:20px 0; text-align:center; }

  table { border-collapse:collapse; width:100%; min-width:max-content; font-size:12.5px; }
  th { text-align:left; color:var(--dim); font-weight:600; padding:5px 10px 5px 0;
       border-bottom:1px solid var(--line); white-space:nowrap; font-size:11px;
       text-transform:uppercase; letter-spacing:.05em; }
  td { padding:5px 10px 5px 0; border-bottom:1px solid #1b222c; white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { max-height:340px; overflow-y:auto; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:8px; font-size:11.5px; color:var(--dim); }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
  .bar-row { display:grid; grid-template-columns:130px 1fr 62px; gap:10px; align-items:center;
             margin-bottom:5px; font-size:12.5px; }
  .bar-track { background:#0d1117; border-radius:3px; height:17px; overflow:hidden; }
  .bar-fill  { height:100%; border-radius:3px; }
  .muted { color:var(--dim); }
  svg { display:block; max-width:100%; }

  .runlist tr { cursor:pointer; }
  .runlist tr:hover td { background:#1c2531; }
  .backlink { background:none; border:none; color:var(--accent); cursor:pointer;
              padding:0; font:inherit; font-size:13px; }
  .backlink:hover { text-decoration:underline; }
  .meta { display:flex; gap:22px; flex-wrap:wrap; margin:2px 0 18px;
          font-size:12.5px; color:var(--dim); }
  .meta b { color:var(--fg); font-weight:600; }
  .tl { list-style:none; padding:0; margin:0; }
  .tl li { display:grid; grid-template-columns:72px 1fr; gap:12px; padding:6px 0;
           border-bottom:1px solid #1b222c; font-size:12.5px; }
  .tl .w { color:var(--dim); font-variant-numeric:tabular-nums; }
  .tl .ev { font-weight:600; }
  .tl .px { color:var(--dim); font-weight:400; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Game registry. Adding a title = adding one entry here plus its sql/panels
// file. Nothing else in this dashboard is game-specific.
// ═══════════════════════════════════════════════════════════════════════════
const GAMES = {
  'silicon-tycoon': {
    title: 'Silicon Tycoon',
    unit: 'week',
    panels: [
      { view:'p_st_survival', title:'Survival curve', wide:true,
        sub:'Share of runs still going at week N. The flattest line is the kindest difficulty.',
        render:r => lineChart(r, {x:'week', y:'alive_frac', series:'difficulty', yPct:true, yMax:1}) },

      { view:'p_st_balance_band', title:'Cash over time', wide:true,
        sub:'Median balance per difficulty. Below the zero line the run is underwater.',
        render:r => lineChart(r, {x:'week', y:'median', series:'difficulty', money:true, zeroLine:true}) },

      { view:'p_st_insolvency', title:'When runs go underwater',
        sub:'First week the balance went negative, and whether it ever came back.',
        render:r => {
          const by = groupSum(r, d => d.week_underwater, d => +d.runs);
          return barList(by, {max:14, fmt:n=>n+' runs', label:w=>`week ${w}`});
        } },

      { view:'p_st_funnel', title:'Progression funnel',
        sub:'How far runs get, by difficulty.',
        render:r => funnel(r, ['started','built_line','signed_contract','delivered','ipo']) },

      { view:'p_st_yield', title:'Yield achieved',
        sub:'What players actually get, against the bench figure.',
        render:r => scroll(table(r.slice().sort((a,b)=>b.n-a.n), [
          ['cleanroom','Cleanroom'], ['difficulty','Difficulty'],
          ['median_yield','Median yield',1,v=>pct(v)],
          ['median_node_nm','Median node',1], ['n','Samples',1]])) },

      { view:'p_st_nodes', title:'Node progression',
        sub:'Median process node reached, by in-game year. Lower is more advanced.',
        render:r => lineChart(r.slice().sort((a,b)=>a.game_year-b.game_year),
                    {x:'game_year', y:'median_node_nm', invertY:true, xIsYear:true}) },

      { view:'p_st_popularity', title:'Starting choices',
        sub:'Which of the 80 combinations get picked.',
        render:r => {
          const models = groupSum(r, d=>d.model, d=>+d.runs);
          const eras   = groupSum(r, d=>d.start_year, d=>+d.runs);
          const diffs  = groupSum(r, d=>d.difficulty, d=>+d.runs);
          const wrap = document.createElement('div');
          for (const [name, data] of [['Business model',models],['Difficulty',diffs],['Start era',eras]]) {
            const h = document.createElement('div');
            h.className = 'muted'; h.style.cssText='font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px';
            h.textContent = name; wrap.append(h, barList(data, {fmt:n=>n+' runs'}));
          }
          return wrap;
        } },

      { view:'p_st_cleanroom', title:'Cleanroom: leased or bought',
        sub:'Whether the leasing system gets used.',
        render:r => scroll(table(r.slice().sort((a,b)=>b.runs-a.runs), [
          ['cleanroom_class','Class'], ['leased_or_bought','Acquired'], ['runs','Runs',1]])) },

      { view:'p_st_contracts', title:'Contract outcomes',
        sub:'On time vs late, and what the late fee costs.',
        render:r => scroll(table(r, [
          ['difficulty','Difficulty'], ['outcome','Outcome'], ['deliveries','Deliveries',1],
          ['mean_late_weeks','Mean weeks late',1], ['mean_penalty','Mean penalty',1,v=>money(v)]])) },

      { view:'p_st_pages', title:'Screens opened',
        sub:'Share of runs that ever opened each screen.',
        render:r => barList(r.map(d=>[d.page, Math.round(100*d.runs_visiting/Math.max(1,d.total_runs))]),
                    {fmt:n=>n+'%', max:20}) },

      { view:'p_st_returns', title:'Return sessions',
        sub:'How many players started more than one run.',
        render:r => barList(r.map(d=>[`${d.sessions} run${d.sessions>1?'s':''}`, +d.players]),
                    {fmt:n=>n+' players'}) },

      { view:'p_st_channels', title:'Where runs come from',
        sub:'itch, GitHub Pages or local, and which build.',
        render:r => scroll(table(r.slice().sort((a,b)=>b.runs-a.runs), [
          ['host','Host'], ['build','Build'], ['runs','Runs',1],
          ['mean_weeks','Mean weeks',1], ['underwater','Underwater',1]])) },

      { view:'v_runs', title:'Run inspector', wide:true,
        sub:'Every run, newest first. Click one to see how it went.',
        render:(rows, ctx) => runList(rows, ctx) },

      { view:'p_st_names', title:'The name wall', wide:true,
        sub:'What people called their company.',
        render:r => scroll(table(r, [
          ['company_name','Name'], ['model','Model'], ['difficulty','Difficulty'],
          ['start_year','Era',1], ['weeks_survived','Weeks',1],
          ['started_at','Started',0,v=>new Date(v).toLocaleDateString()]])) },
    ],
  },
};

// ═══════════════════════════════════════════════════════════════════════════
// Supabase access. Credentials live in this browser's localStorage and are
// never written to disk by the repo, so nothing here can leak into git.
// ═══════════════════════════════════════════════════════════════════════════
const CFG_KEY = 'gt-dashboard-cfg';
const cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null') || {};
let session = null;

async function signIn(url, anonKey, email, password) {
  const r = await fetch(`${url}/auth/v1/token?grant_type=password`, {
    method:'POST',
    headers:{ apikey:anonKey, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.error || `sign-in failed (${r.status})`);
  session = j;
  Object.assign(cfg, { url, anonKey, refresh: j.refresh_token });
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
}

async function resume() {
  if (!cfg.url || !cfg.refresh) return false;
  const r = await fetch(`${cfg.url}/auth/v1/token?grant_type=refresh_token`, {
    method:'POST', headers:{ apikey:cfg.anonKey, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: cfg.refresh }),
  });
  if (!r.ok) return false;
  session = await r.json();
  cfg.refresh = session.refresh_token;
  localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  return true;
}

function signOut() { localStorage.removeItem(CFG_KEY); session = null; location.reload(); }

async function q(view, params = '') {
  const r = await fetch(`${cfg.url}/rest/v1/${view}${params ? '?' + params : ''}`, {
    headers: { apikey: cfg.anonKey, Authorization: `Bearer ${session.access_token}` },
  });
  if (r.status === 401) throw new Error('SESSION_EXPIRED');
  if (!r.ok) throw new Error(`${view}: ${r.status} ${(await r.text()).slice(0, 200)}`);
  return r.json();
}

// ═══════════════════════════════════════════════════════════════════════════
// Rendering helpers
// ═══════════════════════════════════════════════════════════════════════════
const PALETTE = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v; else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : String(k));
  return e;
};
const money = n => {
  const v = Number(n) || 0, a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e9) return `${s}$${(a/1e9).toFixed(1)}B`;
  if (a >= 1e6) return `${s}$${(a/1e6).toFixed(1)}M`;
  if (a >= 1e3) return `${s}$${(a/1e3).toFixed(0)}k`;
  return `${s}$${a.toFixed(0)}`;
};
const pct = v => `${(Number(v) * 100).toFixed(1)}%`;
const groupSum = (rows, keyFn, valFn) => {
  const m = new Map();
  for (const r of rows) { const k = keyFn(r); m.set(k, (m.get(k) || 0) + (valFn(r) || 0)); }
  return [...m.entries()].sort((a, b) => (typeof a[0] === 'number' ? a[0] - b[0] : b[1] - a[1]));
};
const scroll = el => h('div', { class:'scroll' }, el);

function table(rows, cols) {
  if (!rows.length) return h('div', { class:'empty' }, 'No data yet');
  const t = h('table');
  t.append(h('tr', {}, cols.map(([, label, num]) => h('th', { class: num ? 'num' : '' }, label))));
  for (const r of rows) {
    t.append(h('tr', {}, cols.map(([key, , num, fmt]) => {
      const raw = r[key];
      const val = raw == null ? '—' : (fmt ? fmt(raw) : raw);
      return h('td', { class: num ? 'num' : '' }, val);
    })));
  }
  return t;
}

function barList(pairs, { fmt = String, max = 12, label = String } = {}) {
  if (!pairs.length) return h('div', { class:'empty' }, 'No data yet');
  const top = pairs.slice(0, max);
  const peak = Math.max(...top.map(p => p[1]), 1);
  return h('div', {}, top.map(([k, v], i) =>
    h('div', { class:'bar-row' },
      h('div', { class:'muted', style:'overflow:hidden;text-overflow:ellipsis' }, label(k)),
      h('div', { class:'bar-track' },
        h('div', { class:'bar-fill', style:`width:${(v/peak)*100}%;background:${PALETTE[i % PALETTE.length]}` })),
      h('div', { class:'num', style:'text-align:right' }, fmt(v)))));
}

function funnel(rows, stages) {
  if (!rows.length) return h('div', { class:'empty' }, 'No data yet');
  const wrap = h('div');
  for (const r of rows) {
    wrap.append(h('div', { class:'muted', style:'font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px' }, r.difficulty));
    const base = Math.max(1, +r[stages[0]]);
    wrap.append(barList(stages.map(s => [s.replace(/_/g, ' '), +r[s]]), {
      fmt: n => `${n}  ${Math.round(100 * n / base)}%`, max: 9 }));
  }
  return wrap;
}

function lineChart(rows, { x, y, series, yPct, money: isMoney, invertY, yMax, zeroLine, xIsYear } = {}) {
  if (!rows.length) return h('div', { class:'empty' }, 'No data yet');
  const W = 640, H = 260, P = { l: 58, r: 14, t: 12, b: 30 };
  const groups = new Map();
  for (const r of rows) {
    const k = series ? (r[series] ?? '—') : 'all';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push({ x: +r[x], y: r[y] == null ? null : +r[y] });
  }
  for (const pts of groups.values()) pts.sort((a, b) => a.x - b.x);

  const all = [...groups.values()].flat().filter(p => p.y != null);
  if (!all.length) return h('div', { class:'empty' }, 'No data yet');
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || 1;
  let y0 = Math.min(0, Math.min(...ys)), y1 = yMax ?? Math.max(...ys);
  if (invertY) { y0 = Math.min(...ys); y1 = Math.max(...ys); }
  if (y1 === y0) y1 = y0 + 1;

  const px = v => P.l + ((v - x0) / (x1 - x0 || 1)) * (W - P.l - P.r);
  const py = v => invertY
    ? P.t + ((v - y0) / (y1 - y0)) * (H - P.t - P.b)
    : H - P.b - ((v - y0) / (y1 - y0)) * (H - P.t - P.b);

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', '100%');
  const add = (tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text != null) e.textContent = text;
    svg.append(e); return e;
  };
  const fmtY = v => yPct ? `${Math.round(v * 100)}%` : isMoney ? money(v) : (v >= 1000 ? (v/1000).toFixed(0)+'k' : v.toFixed(v < 10 ? 1 : 0));
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (i / 4) * (y1 - y0), yy = py(v);
    add('line', { x1:P.l, x2:W-P.r, y1:yy, y2:yy, stroke:'#242c38', 'stroke-width':1 });
    add('text', { x:P.l-8, y:yy+4, fill:'#8b949e', 'font-size':10, 'text-anchor':'end' }, fmtY(v));
  }
  if (zeroLine && y0 < 0 && y1 > 0)
    add('line', { x1:P.l, x2:W-P.r, y1:py(0), y2:py(0), stroke:'#f85149', 'stroke-width':1, 'stroke-dasharray':'3 3', opacity:.7 });
  for (let i = 0; i <= 4; i++) {
    const v = x0 + (i / 4) * (x1 - x0);
    add('text', { x:px(v), y:H-10, fill:'#8b949e', 'font-size':10, 'text-anchor':'middle' },
        xIsYear ? Math.round(v) : Math.round(v));
  }
  let ci = 0;
  const legend = h('div', { class:'legend' });
  for (const [name, pts] of groups) {
    const colour = PALETTE[ci++ % PALETTE.length];
    const d = pts.filter(p => p.y != null).map((p, i) => `${i ? 'L' : 'M'}${px(p.x).toFixed(1)} ${py(p.y).toFixed(1)}`).join(' ');
    if (d) add('path', { d, fill:'none', stroke:colour, 'stroke-width':2, 'stroke-linejoin':'round' });
    if (series) legend.append(h('span', {}, h('i', { style:`background:${colour}` }), name));
  }
  return h('div', {}, series ? legend : null, svg);
}

function runList(rows, ctx) {
  const sorted = rows.slice().sort((a, b) => +new Date(b.started_at) - +new Date(a.started_at));
  const t = h('table', { class:'runlist' });
  t.append(h('tr', {}, ['Company','Model','Difficulty','Era','Weeks','Host','Started']
    .map((x, i) => h('th', { class: i === 4 ? 'num' : '' }, x))));
  for (const r of sorted.slice(0, 200)) {
    const m = r.meta || {};
    const tr = h('tr', {},
      h('td', {}, m.company_name || '—'),
      h('td', {}, m.model || '—'),
      h('td', {}, m.difficulty || '—'),
      h('td', {}, m.start_year ?? '—'),
      h('td', { class:'num' }, r.last_progress ?? 0),
      h('td', { class:'muted' }, r.host || '—'),
      h('td', { class:'muted' }, new Date(r.started_at).toLocaleString()));
    tr.onclick = () => runDetail(r, ctx);
    t.append(tr);
  }
  return scroll(t);
}

/** One run, in full. Private to the dashboard — reads runs/events directly. */
async function runDetail(run, ctx) {
  const m = run.meta || {};
  const back = h('button', { class:'backlink' }, '← all panels');
  back.onclick = () => dashboard(ctx.game);

  const head = h('main', {},
    h('div', { style:'margin-bottom:6px' }, back),
    h('h2', { style:'margin:6px 0 2px;font-size:20px' }, m.company_name || '(unnamed)'),
    h('div', { class:'meta' },
      h('span', {}, 'model ', h('b', {}, m.model || '—')),
      h('span', {}, 'difficulty ', h('b', {}, m.difficulty || '—')),
      h('span', {}, 'era ', h('b', {}, String(m.start_year ?? '—'))),
      h('span', {}, 'build ', h('b', {}, run.build || '—')),
      h('span', {}, 'host ', h('b', {}, run.host || '—')),
      h('span', {}, 'started ', h('b', {}, new Date(run.started_at).toLocaleString())),
      h('span', {}, 'reached ', h('b', {}, `week ${run.last_progress ?? 0}`))),
    h('div', { class:'grid', id:'run-grid' }, h('div', { class:'empty' }, 'Loading…')));
  app.replaceChildren(
    h('header', {}, h('h1', {}, 'Telemetry'), h('div', { class:'spacer' }),
      (() => { const b = h('button', {}, 'Sign out'); b.onclick = signOut; return b; })()),
    head);

  let events = [];
  try { events = await q('events', `select=name,progress,value,props&run_id=eq.${run.run_id}&limit=5000`); }
  catch (err) {
    return document.getElementById('run-grid').replaceChildren(
      h('div', { class:'card' }, h('h3', {}, 'Could not load events'), h('div', { class:'err' }, err.message)));
  }
  events.sort((a, b) => (a.progress ?? 0) - (b.progress ?? 0));
  const snaps = events.filter(e => e.name === 'snapshot');
  const grid  = document.getElementById('run-grid');
  grid.replaceChildren();

  const card = (title, sub, body) => grid.append(h('div', { class:'card wide' },
    h('h3', {}, title), sub ? h('p', { class:'sub' }, sub) : null, h('div', { class:'body' }, body)));

  if (snaps.length) {
    // Cash gets its own chart. Balance runs in millions while valuation runs in
    // billions, so on one linear axis the balance line is flat against zero and
    // tells you nothing.
    card('Cash balance', 'Money in the bank, by week. Below the line the run is underwater.',
      lineChart(snaps.map(s => ({ week:s.progress, v:Number(s.value) })),
        { x:'week', y:'v', money:true, zeroLine:true }));

    const val = snaps.filter(s => s.props?.valuation != null)
                     .map(s => ({ series:'valuation', week:s.progress, v:s.props.valuation }));
    const nw  = snaps.filter(s => s.props?.net_worth != null)
                     .map(s => ({ series:'net worth', week:s.progress, v:s.props.net_worth }));
    if (val.length || nw.length)
      card('Company value', 'Valuation (revenue x prestige multiple) against net worth (assets minus debt).',
        lineChart([...val, ...nw], { x:'week', y:'v', series:'series', money:true, zeroLine:true }));

    const yields = snaps.filter(s => s.props?.yield != null);
    if (yields.length) card('Yield and node', 'Mean line yield by week; node shown in the table.',
      lineChart(yields.map(s => ({ week:s.progress, y:s.props.yield })),
        { x:'week', y:'y', yPct:true, yMax:1 }));

    card('Snapshots', `${snaps.length} recorded, every 8 weeks.`,
      scroll(table(snaps.map(s => ({
        week: s.progress, balance: money(Number(s.value)),
        valuation: s.props?.valuation != null ? money(s.props.valuation) : '—',
        net_worth: s.props?.net_worth != null ? money(s.props.net_worth) : '—',
        node: s.props?.node ?? '—', yield: s.props?.yield != null ? pct(s.props.yield) : '—',
        cleanroom: s.props?.cleanroom ?? '—', lines: s.props?.lines ?? '—',
      })), [['week','Week',1],['balance','Balance',1],['valuation','Valuation',1],
            ['net_worth','Net worth',1],['node','Node',1],['yield','Yield',1],
            ['cleanroom','Cleanroom'],['lines','Lines',1]])));
  } else {
    card('No snapshots', 'This run reported no economy snapshots — it may have been blocked or very short.', h('div', { class:'empty' }, '—'));
  }

  const pages = events.filter(e => e.name === 'page_view')
                      .map(e => e.props?.page).filter(Boolean);
  if (pages.length) card('Screens opened', 'Which screens this run ever visited.',
    h('div', {}, [...new Set(pages)].join(' · ')));

  const marks = events.filter(e => e.name !== 'snapshot' && e.name !== 'page_view');
  card('Timeline', `${marks.length} milestone${marks.length === 1 ? '' : 's'}.`,
    marks.length
      ? h('ul', { class:'tl' }, marks.map(e => h('li', {},
          h('span', { class:'w' }, `week ${e.progress ?? 0}`),
          h('span', {}, h('span', { class:'ev' }, e.name.replace(/_/g, ' ')),
            Object.keys(e.props || {}).length
              ? h('span', { class:'px' }, '  ' + Object.entries(e.props)
                  .map(([k, v]) => `${k}=${v}`).join('  '))
              : null))))
      : h('div', { class:'empty' }, 'No milestones recorded'));
}

// ═══════════════════════════════════════════════════════════════════════════
// Views
// ═══════════════════════════════════════════════════════════════════════════
const app = document.getElementById('app');

function loginView(msg) {
  const f = h('div', { class:'login' },
    h('h2', {}, 'Game telemetry'),
    h('p', {}, 'Credentials stay in this browser. Nothing is written to the repo.'),
    h('label', {}, 'Supabase project URL'),
    h('input', { id:'u', placeholder:'https://xxxx.supabase.co', value: cfg.url || '' }),
    h('label', {}, 'anon key'),
    h('input', { id:'k', placeholder:'eyJ…', value: cfg.anonKey || '' }),
    h('label', {}, 'Email'),
    h('input', { id:'e', type:'email', autocomplete:'username' }),
    h('label', {}, 'Password'),
    h('input', { id:'p', type:'password', autocomplete:'current-password' }),
    h('button', { class:'primary' }, 'Sign in'),
    msg ? h('div', { class:'err' }, msg) : null,
    h('div', { class:'hint' }, 'Create this login in Supabase under Authentication → Users. The anon key alone cannot read anything: row level security grants it INSERT only.'),
  );
  const go = async () => {
    const btn = f.querySelector('button');
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await signIn(f.querySelector('#u').value.trim().replace(/\/$/, ''),
                   f.querySelector('#k').value.trim(),
                   f.querySelector('#e').value.trim(),
                   f.querySelector('#p').value);
      dashboard();
    } catch (err) { app.replaceChildren(loginView(err.message)); }
  };
  f.querySelector('button').onclick = go;
  f.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  return f;
}

async function dashboard(gameId) {
  app.replaceChildren(h('main', {}, h('div', { class:'empty' }, 'Loading…')));
  let games = [];
  try { games = await q('games', 'select=*'); }
  catch (err) {
    if (err.message === 'SESSION_EXPIRED') return app.replaceChildren(loginView('Session expired. Sign in again.'));
    return app.replaceChildren(h('main', {}, h('div', { class:'card' },
      h('h3', {}, 'Could not reach the database'), h('div', { class:'err' }, err.message))));
  }
  if (!games.length) return app.replaceChildren(h('main', {}, h('div', { class:'card' },
    h('h3', {}, 'No games registered'),
    h('p', { class:'sub' }, "Insert a row into `games`, e.g. ('silicon-tycoon','Silicon Tycoon','week')."))));

  const active = gameId || games[0].game_id;
  const spec = GAMES[active];

  const picker = h('select', {}, games.map(g =>
    h('option', Object.assign({ value:g.game_id }, g.game_id === active ? { selected:'' } : {}), g.title)));
  picker.onchange = () => dashboard(picker.value);
  const refresh = h('button', {}, 'Refresh');
  refresh.onclick = () => dashboard(active);
  const out = h('button', {}, 'Sign out'); out.onclick = signOut;

  const strip = h('div', { class:'strip' });
  const grid  = h('div', { class:'grid' });
  app.replaceChildren(
    h('header', {}, h('h1', {}, 'Telemetry'), picker, h('div', { class:'spacer' }), refresh, out),
    h('main', {}, strip, grid));

  // Overview strip, from the generic view every game has.
  try {
    const runs = await q('v_runs', `select=last_progress,started_at,went_underwater&game_id=eq.${active}`);
    const week = Date.now() - 7 * 864e5;
    const recent = runs.filter(r => +new Date(r.started_at) > week).length;
    const lens = runs.map(r => +r.last_progress).sort((a, b) => a - b);
    const med = lens.length ? lens[Math.floor(lens.length / 2)] : 0;
    const under = runs.filter(r => r.went_underwater).length;
    for (const [k, v] of [['Runs', runs.length], ['Last 7 days', recent],
                          [`Median ${spec?.unit || 'progress'}s`, med],
                          ['Went underwater', runs.length ? Math.round(100 * under / runs.length) + '%' : '—']])
      strip.append(h('div', { class:'stat' }, h('div', { class:'v' }, v), h('div', { class:'k' }, k)));
  } catch { /* strip is a nicety */ }

  if (!spec) return grid.append(h('div', { class:'card' },
    h('h3', {}, `No panels defined for "${active}"`),
    h('p', { class:'sub' }, 'Add an entry to the GAMES registry at the top of this file.')));

  for (const p of spec.panels) {
    const card = h('div', { class: p.wide ? 'card wide' : 'card' },
      h('h3', {}, p.title), p.sub ? h('p', { class:'sub' }, p.sub) : null,
      h('div', { class:'body' }, h('div', { class:'empty' }, 'Loading…')));
    grid.append(card);
    const params = p.view === 'v_runs'
      ? `select=*&game_id=eq.${active}&order=started_at.desc&limit=200`
      : 'select=*';
    q(p.view, params)
      .then(rows => card.querySelector('.body').replaceChildren(
        rows.length ? p.render(rows, { game: active, spec }) : h('div', { class:'empty' }, 'No data yet')))
      .catch(err => card.querySelector('.body').replaceChildren(h('div', { class:'err' }, err.message)));
  }
}

(async () => { app.replaceChildren(await resume() ? h('div') : loginView()); if (session) dashboard(); })();
</script>
